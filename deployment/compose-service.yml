# Fragment for /docker/docker-compose.yml under its existing services map.
# Reuse the existing caddy network definition; it resolves to docker_caddy.
  emviary:
    image: emviary:poc-010
    pull_policy: never
    container_name: emviary
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      TZ: America/Denver
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EMVIARY_CONFIG: /config/site.json
      EMVIARY_DATA_DIR: /data
      EMVIARY_ART_DIR: /art
      EMVIARY_BACKUP_DIR: /backups
      EMVIARY_PORT: "8080"
      EMVIARY_EBIRD_API_KEY_FILE: /run/secrets/ebird-api-key
    volumes:
      - /docker/appdata/emviary/config:/config:ro
      - /docker/appdata/emviary/art:/art:ro
      - /docker/appdata/emviary/data:/data
      - /docker/backups/emviary:/backups
      - /docker/appdata/emviary/secrets:/run/secrets
    networks:
      - caddy
    labels:
      caddy: "emviary.majjix.com, eink.majjix.com"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
