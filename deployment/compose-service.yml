# Fragment for /docker/docker-compose.yml under its existing services map.
# Reuse the existing caddy network definition; it resolves to docker_caddy.
  einkartifact:
    image: einkartifact:poc-005
    pull_policy: never
    container_name: einkartifact
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      TZ: America/Denver
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EINK_CONFIG: /config/site.json
      EINK_DATA_DIR: /data
      EINK_ART_DIR: /art
      EINK_BACKUP_DIR: /backups
      EINK_PORT: "8080"
      EINK_EBIRD_API_KEY_FILE: /run/secrets/ebird-api-key
    volumes:
      - /docker/appdata/einkartifact/config:/config:ro
      - /docker/appdata/einkartifact/art:/art:ro
      - /docker/appdata/einkartifact/data:/data
      - /docker/backups/einkartifact:/backups
      - /docker/appdata/einkartifact/secrets:/run/secrets
    networks:
      - caddy
    labels:
      caddy: eink.majjix.com
      caddy.reverse_proxy: "{{upstreams 8080}}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
